# zorn: WPA2-PSK access point on the WCN7850, 2.4 GHz.
#
# 2.4 GHz on purpose: 5 GHz on this device still needs its real board data file
# (the generic BDF gets the channel list wrong), so the band that is known good
# is the one the hotspot uses.
interface=wlp1s0
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0

ssid=zorn
country_code=CN
ieee80211d=1
hw_mode=g
channel=6

wmm_enabled=1
ieee80211n=1
ht_capab=[SHORT-GI-20]

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Change this. It is a known default, written down in the repo, so treat the
# hotspot as open until you do.
wpa_passphrase=zornzorn

# No management-frame protection: it costs nothing to leave off here and some
# older clients still refuse it.
ieee80211w=0
